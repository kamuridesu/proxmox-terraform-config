---
- name: Install Wireguard and iptables
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
      - iptables
    state: present
    update_cache: true

- name: Generate wireguard private key if missing
  ansible.builtin.shell: umask 077 && wg genkey > /etc/wireguard/private.key
  args:
    creates: /etc/wireguard/private.key

- name: Read private key
  ansible.builtin.command: cat /etc/wireguard/private.key
  register: wg_private_key
  changed_when: false
  no_log: true

- name: Derive public key
  ansible.builtin.shell: wg pubkey < /etc/wireguard/private.key
  register: wg_public_key
  changed_when: false

- name: Load road-warrior peer definitions
  ansible.builtin.set_fact:
    wg_client_peers: "{{ wg_client_peers + [lookup('file', item) | from_yaml] }}"
  loop: "{{ query('fileglob', role_path ~ '/vars/peers/*.yml') | sort }}"
  when: "'oracle' in group_names"

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Deploy Wireguard config
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  notify: Restart Wireguard

- name: Ensure wireguard is enabled and running
  ansible.builtin.systemd:
    name: wg-quick@wg0
    state: started
    enabled: true
